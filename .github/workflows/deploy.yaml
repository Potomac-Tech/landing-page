# Emergency rebuild of the legacy static site. Production runs on Cloudflare.
name: Rebuild legacy Pages rollback

on:
  # A push must never publish the Worker build to GitHub Pages.
  # This rebuild does not switch DNS away from Cloudflare.
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # A manual run from a preview branch must not replace the production site.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Preserve the last known-good static site for an explicit rollback.
          # The current application on main requires Cloudflare Workers.
          ref: 1309b080fe511ef9e09c6d4cc06c7907a5c571a8
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify static entry point
        run: |
          if [ ! -s dist/index.html ]; then
            echo "::error::GitHub Pages requires dist/index.html; refusing to publish a non-static build."
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
